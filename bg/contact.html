<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <ul class="nav-list">
                <li class="nav-item"><a href="index.html" class="nav-link">Начало</a></li>

            </ul>
            <!-- Language Switcher -->
            <div class="language-switcher">
                <div class="lang-toggle" onclick="toggleLanguageMenu()">
                    <span class="flag">🇧🇬</span>
                    <span class="lang-text">BG</span>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="lang-menu" id="langMenu">

                    </a>
                    <a href="contact.html" class="lang-option active">
                        <span class="flag">🇧🇬</span>
                        <span class="lang-name">Български</span>
                    </a>
                </div>
            </div>
            <div class="hamburger" id="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <!-- Contact Header -->
    <section class="page-header">
        <div class="container">
            <h1>Свържете се с нас</h1>
        </div>
    </section>

    <!-- Contact Section -->
    <section class="contact-section">
        <div class="container">
            <div class="contact-form-centered">
                <div class="contact-form">
                    <h2>Изпратете съобщение</h2>
                    <form id="contactForm">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="firstName">Име *</label>
                                <input type="text" id="firstName" name="firstName" required>
                            </div>
                            <div class="form-group">
                                <label for="lastName">Фамилия *</label>
                                <input type="text" id="lastName" name="lastName" required>
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="email">Имейл *</label>
                                <input type="email" id="email" name="email" required>
                            </div>
                            <div class="form-group">
                                <label for="subject">Заглавие *</label>
                                <input type="text" id="subject" name="subject" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="message">Съобщение *</label>
                            <textarea id="message" name="message" rows="6" placeholder="Как можем да Ви помогнем?" required></textarea>
                        </div>
                        
                        <button type="submit" class="btn btn-primary">Изпратете</button>
                    </form>
                </div>
            </div>
        </div>
    </section>


    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>Ideal Shotz</h3>
                    <div class="social-links">

                        <a href="https://www.tiktok.com/@ideal_shotz" target="_blank" rel="noopener noreferrer"><i class="fab fa-tiktok"></i></a>
                        <a href="mailto:shotz.ideal@gmail.com"><i class="fas fa-envelope"></i></a>
                    </div>
                </div>
                <div class="footer-section">
                    <h4>Бърз достъп</h4>
                    <ul>
                        <li><a href="index.html">Начало</a></li>
                        <li><a href="gallery.html">Галерия</a></li>
                        <li><a href="#contact">Контакти</a></li>
                    </ul>
                </div>
                <div class="footer-section">
                    <h4>Контакти</h4>
                    <div class="contact-info">
                        <p><i class="fas fa-phone"></i> +359 889 501 250</p>
                        <p><i class="fas fa-envelope"></i> shotz.ideal@gmail.com</p>
                        <p><i class="fas fa-location-dot"></i> София, България</p>
                    </div>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2025 Ideal Shotz. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="../script.js?v=1.0.28"></script>
</body>
</html>
